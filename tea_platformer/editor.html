<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            padding: 0;
            margin: 0;
            font-family: Helvetica, sans-serif;
        }
        h2{
            color: black;
            padding: 10px 0;
        }
        body{
            min-height: 500px;
            height: 500px;
        }
        #player {
            position: absolute;
            width: 64px;
            height: 64px;
        }
        #pausemenu button{
            color: initial;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea platformer</title>
    <link rel="shortcut icon" href="assets/tea_idle_2.png" type="image/x-icon">
</head>
<body style="width: 100%;"><!-- Width change here -->
    <div id="game" style="background: url(assets/backgroundpage.jpg); background-size: 576px 100%; background-repeat: repeat-x; height: 576px; width: 4096px; image-rendering: pixelated;"> <!-- Width change here -->
        <div id="cursorSprite" style="opacity: 0.5; position: absolute; background: url(assets/ground1_2.png); width: 64px; height: 64px; background-size: 64px 64px; image-rendering: pixelated; box-shadow: 2px 2px 2px 2px black; z-index: 10"></div>
</div>
<footer id="footerDiv" style="width: 100%; min-height: 50px; display: flex; gap: 20px; margin-top: 100px;">
    <div>
        <h2>DELETE to remove selected</h2>
        <h2>MOUSE WHEEL to change</h2>
        <h2>MOUSE CLICK to select or create</h2>
        <h2>ESCAPE to cancel selection</h2>
        <a href="index.html">Go To Game (IN PROGRESS)</a>
    </div>
    <div style="display: flex; flex-direction: column;">
        <div style="flex: 1">
            <label for="xsizeinputtext">Size along x-axis (width)</label>
            <input type="text" name="xsizeinputtext" id="xsizeinput" placeholder="width" value="4096">
            <label for="ysizeinputtext">Size along y-axis (height)</label>
            <input type="text" name="ysizeinputtext" id="ysizeinput" placeholder="height" value="576">
            <button onclick="setup()">Set resolution</button>
        </div>
        <div style="flex: 1">
            <button onclick="exportMap()">Export map</button>
            <button onclick="importMap()">Import map</button>
            <textarea id="mapcodetextarea" placeholder="Map code here"></textarea>
        </div>
    </div>
</footer>
</body>
<script src="editor.js"></script>
</html>
