<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            padding: 0;
            margin: 0;
            font-family: Helvetica, sans-serif;
        }
        h2{
            color: black;
            padding: 10px 0;
        }
        body{
            min-height: 500px;
            height: 500px;
        }
        #player {
            position: absolute;
            width: 64px;
            height: 64px;
        }
        #pausemenu button{
            color: initial;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea platformer</title>
    <link rel="shortcut icon" href="assets/tea_idle_2.png" type="image/x-icon">
</head>
<body style="width: 100%;"><!-- Width change here -->
    <div id="game" style="background: url(assets/backgroundpage.jpg); background-size: 576px 100%; background-repeat: repeat-x; height: 576px; width: 4096px; image-rendering: pixelated;"> <!-- Width change here -->
        <div id="cursorSprite" style="opacity: 0.5; position: absolute; background: url(assets/ground1_2.png); width: 64px; height: 64px; background-size: 64px 64px; image-rendering: pixelated; box-shadow: 2px 2px 2px 2px black; z-index: 10"></div>
</div>
<footer id="footerDiv" style="width: calc(100% - 10px); min-height: 50px; display: flex; gap: 20px; padding: 5px">
    <div>
        <h2>DELETE to remove selected</h2>
        <h2>MOUSE WHEEL to change</h2>
        <h2>MOUSE CLICK to select or create</h2>
        <h2>ESCAPE to cancel selection</h2>
        <a href="index.html">Go To Game (IN PROGRESS)</a>
    </div>
    <div style="display: flex; flex-direction: row; width: 100%; gap: 10px">
        <div style="flex: 1; display: flex; flex-direction: column;">
            <div style="flex: 1; display: flex;">
            <label style="flex: 1" for="xsizeinputtext">Screen width&nbsp;[px]</label>
            <input style="flex: 1" type="text" name="xsizeinputtext" id="xsizeinput" placeholder="width" value="4096">
            </div>
            <div style="flex: 1; display: flex;">
            <label style="flex: 1" for="ysizeinputtext">Screen height&nbsp;[px]</label>
            <input style="flex: 1" type="text" name="ysizeinputtext" id="ysizeinput" placeholder="height" value="576">
            </div>
            <div style="flex: 1; display: flex;">
            <button style="flex: 1" onclick="setup()">Set resolution</button>
            </div>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column-reverse;">
            <button style="flex: 1" onclick="removeAll()">Remove All</button>
            <button style="flex: 1" onclick="exportMap()">Export map</button>
            <button style="flex: 1" onclick="importMap()">Import map</button>
            <textarea style="flex: 1" id="mapcodetextarea" placeholder="Map code here"></textarea>
        </div>
        <div style="flex: 1; display: flex;">
            <button style="flex: 1" onclick="testLevel()">Test current level</button>
        </div>
        <div style="flex: 3; display: flex; flex-direction: column;">
            <h2 style="flex: 1">Properties</h2>
            <div style="flex: 1; display: flex; gap: 10px">
                <label for="properties_asset" style="flex: 1">Asset</label><input type="text" id="properties_asset" placeholder="empty" style="flex: 1">
            </div>
            <div style="flex: 1; display: flex; gap: 10px">
                <label for="properties_posx" style="flex: 1">Pos X</label><input type="text" id="properties_posx" placeholder="empty" style="flex: 1">
            </div>
            <div style="flex: 1; display: flex; gap: 10px">
                <label for="properties_posy" style="flex: 1">Pos Y</label><input type="text" id="properties_posy" placeholder="empty" style="flex: 1">
            </div>
            <div style="flex: 1; display: flex; gap: 10px">
                <label for="properties_sizex" style="flex: 1">Size X</label><input type="text" id="properties_sizex" placeholder="empty" style="flex: 1">
            </div>
            <div style="flex: 1; display: flex; gap: 10px">
                <label for="properties_sizey" style="flex: 1">Size Y</label><input type="text" id="properties_sizey" placeholder="empty" style="flex: 1">
            </div>
            <div style="flex: 1; display: flex; gap: 10px">
                <label for="properties_vaultable" style="flex: 1">Is Vaultable?</label><input type="text" id="properties_vaultable" placeholder="empty" style="flex: 1">
            </div>
            <button style="flex: 1" onclick="setProperties()">Set properties</button>
            <button style="flex: 1" onclick="deleteSelected()">Remove</button>
        </div>
    </div>
</footer>
</body>
<script src="editor.js"></script>
</html>
