<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            padding: 0;
            margin: 0;
            font-family: Helvetica, sans-serif;
        }
        h2{
            color: white;
            padding: 10px 0;
        }
        body{
            min-height: 500px;
            height: 500px;
        }
        #pausemenu button{
            color: initial;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea platformer</title>
    <link rel="shortcut icon" href="assets/tea_idle_2.png" type="image/x-icon">
</head>
<body style="width: 100%; overflow-x: hidden;"><!-- Width change here -->
    <div id="game" style="background: url(assets/backgroundpage.jpg); background-size: 576px 100%; background-repeat: repeat-x; height: 576px; width: 4096px; image-rendering: pixelated;"> <!-- Width change here -->
        <div id="pauseMenu" style="width: 100%; height: 576px; position: absolute; z-index: 11;">
            <div id="pausemenubackground" style="background-color: black; opacity: 0.5; width: 100%; height: 576px;"></div>
            <div style="z-index: 13; position: absolute; top: 200px; left: 20%; background-color: gray; padding: 20px 20% 20px 5%">
                <h2>PAUZA</h2>
                <button onclick="mainLoopStart()" style="padding: 20px 30px">Wznów</button>
            </div>
        </div>
        <div id="player" style=" width: 48px; height: 48px; position: absolute">
            <div id="playergraphic" style="background: url(assets/tea_idle_2.png); background-size: 48px 48px;  width: 48px; height: 48px; image-rendering: pixelated;"></div>
        </div>
</div>
<div id="controls" style="position: absolute;">
    <h3>Controls</h3>
    <div style="display: flex;">
        <div style="display: grid;">
            <div style="image-rendering: pixelated; margin: -12px; height: 100px; width: 100px; grid-row-start: 0; grid-row-end: 1; grid-column-start: 1; grid-column-end: 2; background: url(assets/keyboardhints/up.png);"></div>
            <div style="image-rendering: pixelated; margin: -12px; height: 100px; width: 100px; grid-row-start: 1; grid-row-end: 2; grid-column-start: 0; grid-column-end: 1; background: url(assets/keyboardhints/left.png);"></div>
            <div style="image-rendering: pixelated; margin: -12px; height: 100px; width: 100px; grid-row-start: 1; grid-row-end: 2; grid-column-start: 1; grid-column-end: 2; background: url(assets/keyboardhints/down.png);"></div>
            <div style="image-rendering: pixelated; margin: -12px; height: 100px; width: 100px; grid-row-start: 1; grid-row-end: 2; grid-column-start: 2; grid-column-end: 3; background: url(assets/keyboardhints/right.png);"></div>
        </div>
        <h4>Movement</h4>
        <div>
            <div style="image-rendering: pixelated; height: 100px; width: 100px; grid-row-start: 0; grid-row-end: 1; grid-column-start: 1; grid-column-end: 2; background: url(assets/keyboardhints/shift.png);"></div>
        </div>
        <h4>Running</h4>
        <div>
            <button onclick="importMap()">Import map</button>
            <textarea id="mapcodetextarea" placeholder="Map code here"></textarea>
        </div>
        <a href="editor.html">Go To Editor (IN PROGRESS)</a>
        <button onclick="editLevel()">Edit this level</button>
    </div>
</div>
</body>
<script src="main.js"></script>
</html>
