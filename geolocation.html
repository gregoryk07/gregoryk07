<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
    <h1>Pozycja i prędkość</h1>
    <p id="dlugosc_geograficzna">dlugosc</p>
    <p id="szerokosc_geograficzna">szerokosc</p>
    <p id="dokladność"></p>
    <div id="map" style="height: 800px; width: 800px"></div>
    <script>
        navigator.geolocation.watchPosition((position) => {
            document.getElementById("szerokosc_geograficzna").innerHTML = position.coords.latitude;
            document.getElementById("dlugosc_geograficzna").innerHTML = position.coords.longitude;
            
            var map = L.map('map').setView([position.coords.latitude, position.coords.longitude], 13);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            L.marker([position.coords.latitude, position.coords.longitude]).addTo(map)
                .bindPopup('Twoja lokalizacja.')
                .openPopup();
        
        });


    </script>
</body>
</html>
