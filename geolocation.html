<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
    <h1>Pozycja i prędkość</h1>
    <p>dlugosc: <span id="dlugosc_geograficzna"></span></p>
    <p>szerokosc: <span id="szerokosc_geograficzna"></span></p>
    <p>dokladnosc: <span id="dokladnosc"></span></p>
    <p>timestamp: <span id="timestamp"></span></p>
    <p>wysokosc: <span id="wysokosc"></span></p>
    <p>wysokosc dokladność: <span id="wysokosc_dokladnosc"></span></p>
    <p>predkosc: <span id="speed"></span></p>
    <div id="map" style="height: 200px; width: 200px"></div>
    <script>
        navigator.geolocation.watchPosition((position) => {
            document.getElementById("szerokosc_geograficzna").innerHTML = position.coords.latitude;
            document.getElementById("dlugosc_geograficzna").innerHTML = position.coords.longitude;
            document.getElementById("dokladnosc").innerHTML = position.coords.accuracy;
            document.getElementById("timestamp").innerHTML = position.timestamp;
            document.getElementById("wysokosc").innerHTML = position.coords.altitude;
            document.getElementById("speed").innerHTML = position.coords.speed;
            document.getElementById("wysokosc_dokladnosc").innerHTML = position.coords.altitudeAccuracy;

            
            var map = L.map('map').setView([position.coords.latitude, position.coords.longitude], 13);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            L.marker([position.coords.latitude, position.coords.longitude]).addTo(map)
                .bindPopup('Twoja lokalizacja.')
                .openPopup();
        
        });


    </script>
</body>
</html>
